{{define "content"}}
<div class="page-header">
    <h1 class="page-title">删除组织</h1>
</div>
<div class="card form-narrow">
    <div class="card-content">
        <div class="alert alert-warning mb-3">
            确定要删除组织 <strong>{{.Org.Name}}</strong> 吗？该操作会从配置中移除此组织的全部凭据，不可撤销。
        </div>
        <form method="post" action="/organizations/delete/{{.Org.ID}}">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="flex gap-2">
                <button type="submit" class="btn btn-destructive">确认删除</button>
                <a href="/organizations" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>
{{end}}
