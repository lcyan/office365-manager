{{define "content"}}
<div class="page-header">
    <h1 class="page-title">删除用户确认 · {{.OrgName}}</h1>
    <a href="/user/{{.UserID}}" class="btn btn-outline btn-sm">返回详情</a>
</div>
<div class="card form-narrow">
    <div class="card-content">
        <div class="alert alert-destructive mb-3">
            确定要删除用户 <strong>{{.UserName}}</strong> 吗？此操作不可撤销。
        </div>
        <form method="post" action="/user/{{.UserID}}/delete">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="flex gap-2">
                <button type="submit" class="btn btn-destructive">确认删除</button>
                <a href="/user/{{.UserID}}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>
{{end}}
