{{define "content"}}
<div class="page-header">
    <h1 class="page-title">分配订阅 · {{.UserName}}</h1>
    <a href="/user/{{.UserID}}" class="btn btn-outline btn-sm">返回用户详情</a>
</div>

{{range .Warnings}}
<div class="alert alert-warning">{{.}}</div>
{{end}}

<form method="post" action="/user/{{.UserID}}/license">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="table-wrap mb-3">
        <table class="table">
            <thead>
                <tr>
                    <th>选择</th>
                    <th>产品名称</th>
                    <th>SKU 名称</th>
                    <th>已分配/总数量</th>
                    <th>可用数量</th>
                    <th>订阅状态</th>
                    <th>续订到期日期</th>
                </tr>
            </thead>
            <tbody>
                {{range .Skus}}
                <tr>
                    <td>
                        <input type="checkbox" class="checkbox" name="sku_ids" value="{{.SkuID}}"
                               {{if .Assigned}}checked{{end}}
                               {{if and (not .Assigned) (eq .Available 0)}}disabled{{end}}>
                    </td>
                    <td>{{.ProductName}}</td>
                    <td class="code">{{.SkuPart}}</td>
                    <td>{{.Ratio}}</td>
                    <td>{{.Available}}</td>
                    <td><span class="badge {{.StatusBadge}}">{{.StatusLabel}}</span></td>
                    <td>{{.Renewal}}</td>
                </tr>
                {{else}}
                <tr><td colspan="7" class="table-empty">没有可用订阅。</td></tr>
                {{end}}
            </tbody>
        </table>
    </div>
    <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">分配所选订阅</button>
        <a href="/user/{{.UserID}}" class="btn btn-outline">取消</a>
    </div>
</form>
{{end}}
