{{define "content"}}
<div class="page-header">
    <h1 class="page-title">选择组织</h1>
    <a href="/organizations/test_all" class="btn btn-outline btn-sm">刷新全部 API 状态</a>
</div>
<div class="table-wrap">
    <table class="table">
        <thead>
            <tr>
                <th>组织名称</th>
                <th>API 状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {{range .Orgs}}
            <tr>
                <td>{{.Name}}</td>
                <td>
                    {{if eq .Status "ok"}}<span class="badge badge-success">可用</span>
                    {{else if eq .Status "fail"}}<span class="badge badge-destructive">不可用</span>
                    {{else}}<span class="text-muted">未测试</span>{{end}}
                </td>
                <td>
                    <div class="flex gap-2">
                        <a href="/select_org/{{.ID}}?next=/users" class="btn btn-primary btn-sm">选择</a>
                        <a href="/organizations/test/{{.ID}}" class="btn btn-outline btn-sm">刷新 API</a>
                    </div>
                </td>
            </tr>
            {{else}}
            <tr><td colspan="3" class="table-empty">暂无组织，请先在“组织管理”页面添加。</td></tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
