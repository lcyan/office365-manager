services:
  office365-manager:
    image: ${IMAGE:-ghcr.io/lcyan/office365-manager:latest}
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      CONFIG_FILE: /app/data/config.json
    volumes:
      - ./data:/app/data
